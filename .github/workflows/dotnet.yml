# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore -p:EnableWindowsTargeting=true
    - name: Build
      run: dotnet build --no-restore -p:EnableWindowsTargeting=true
    - name: Test
      run: dotnet test --no-build --verbosity normal -p:EnableWindowsTargeting=true
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:EnableWindowsTargeting=true
    - name: Create GitHub release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: build-${{ github.run_number }}
        name: MediaBridge build ${{ github.run_number }}
        generate_release_notes: true
        files: bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/MediaBridge.exe
        fail_on_unmatched_files: true
